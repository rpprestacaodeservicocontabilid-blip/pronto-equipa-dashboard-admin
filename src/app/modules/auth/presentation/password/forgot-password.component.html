<app-auth-form-frame title="Forgot password?" description="Enter your email to request password reset instructions." [error]="error()" [notice]="notice()">
    <form #form="ngForm" (ngSubmit)="form.valid && submit()" class="space-y-5 text-gray-700 dark:text-gray-400">
      <label class="block text-sm" for="recovery-email">Email<input appAuthInput id="recovery-email" name="email" type="email" email [(ngModel)]="email" required autocomplete="email" /></label>
      <button [disabled]="busy() || form.invalid" class="h-11 w-full rounded-lg bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50 dark:bg-brand-500 dark:hover:bg-brand-600">{{ busy() ? 'Sending…' : 'Send reset instructions' }}</button>
      <a routerLink="/reset-password" class="block text-sm text-brand-500 dark:text-brand-400">Already have a reset token?</a>
    </form>
  </app-auth-form-frame>
