<app-auth-form-frame i18n-title="@@ui-1qt9b3c" title="Forgot password?" i18n-description="@@auth-message-13" description="Enter your email to request password reset instructions." [error]="error()" [notice]="notice()">
    <form #form="ngForm" (ngSubmit)="form.valid && submit()" class="space-y-5 text-gray-700 dark:text-gray-400">
      <label class="block text-sm" for="recovery-email"><ng-container i18n="@@ui-inbfc7">Email</ng-container><input appAuthInput id="recovery-email" name="email" type="email" email [(ngModel)]="email" required autocomplete="email" /></label>
      <button [disabled]="busy() || form.invalid" class="h-11 w-full rounded-lg bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50 dark:bg-brand-500 dark:hover:bg-brand-600">@if (busy()) { <ng-container i18n="@@auth-message-14">Sending…</ng-container> } @else { <ng-container i18n="@@auth-message-15">Send reset instructions</ng-container> }</button>
      <a routerLink="/reset-password" class="block text-sm text-brand-500 dark:text-brand-400"><ng-container i18n="@@auth-message-16">Already have a reset token?</ng-container></a>
    </form>
  </app-auth-form-frame>
