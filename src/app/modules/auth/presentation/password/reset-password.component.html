<app-auth-form-frame i18n-title="@@ui-squy21" title="Reset password" i18n-description="@@auth-message-17" description="Use the token from your reset email to choose a new password." [error]="error()" [notice]="notice()">
    @if (!done()) {
      <form #form="ngForm" (ngSubmit)="form.valid && submit()" class="space-y-5 text-gray-700 dark:text-gray-400">
        <label class="block text-sm" for="reset-token"><ng-container i18n="@@auth-message-18">Reset token</ng-container><input appAuthInput id="reset-token" name="token" [(ngModel)]="token" required autocomplete="off" /></label>
        <label class="block text-sm" for="reset-new"><ng-container i18n="@@ui-th3d82">New password</ng-container><input appAuthInput id="reset-new" name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" /></label>
        <label class="block text-sm" for="reset-confirm"><ng-container i18n="@@ui-p7hh5s">Confirm password</ng-container><input appAuthInput id="reset-confirm" name="confirm" type="password" [(ngModel)]="confirm" required autocomplete="new-password" /></label>
        <button [disabled]="busy() || form.invalid" class="h-11 w-full rounded-lg bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50 dark:bg-brand-500 dark:hover:bg-brand-600">@if (busy()) { <ng-container i18n="@@auth-message-19">Saving…</ng-container> } @else { <ng-container i18n="@@ui-squy21">Reset password</ng-container> }</button>
      </form>
    }
    <a routerLink="/signin" class="mt-5 block text-sm text-brand-500 dark:text-brand-400"><ng-container i18n="@@ui-w9nig3">Sign in</ng-container></a>
  </app-auth-form-frame>
