<app-auth-form-frame title="Reset password" description="Use the token from your reset email to choose a new password." [error]="error()" [notice]="notice()">
    @if (!done()) {
      <form #form="ngForm" (ngSubmit)="form.valid && submit()" class="space-y-5 text-gray-700 dark:text-gray-400">
        <label class="block text-sm" for="reset-token">Reset token<input appAuthInput id="reset-token" name="token" [(ngModel)]="token" required autocomplete="off" /></label>
        <label class="block text-sm" for="reset-new">New password<input appAuthInput id="reset-new" name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" /></label>
        <label class="block text-sm" for="reset-confirm">Confirm password<input appAuthInput id="reset-confirm" name="confirm" type="password" [(ngModel)]="confirm" required autocomplete="new-password" /></label>
        <button [disabled]="busy() || form.invalid" class="h-11 w-full rounded-lg bg-brand-500 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50 dark:bg-brand-500 dark:hover:bg-brand-600">{{ busy() ? 'Saving…' : 'Reset password' }}</button>
      </form>
    }
    <a routerLink="/signin" class="mt-5 block text-sm text-brand-500 dark:text-brand-400">Sign in</a>
  </app-auth-form-frame>
