<form
  [formGroup]="signInForm"
  (ngSubmit)="onSubmit()"
  [class]="'space-y-5 ' + className"
  noValidate
>
  <div
    role="group"
    data-slot="field"
    data-orientation="vertical"
    class="group/field flex w-full gap-2 flex-col *:w-full [&>.sr-only]:w-auto"
    [attr.data-invalid]="isFieldInvalid('email') ? 'true' : null"
  >
    <label for="signin-identifier" class="group/field-label peer/field-label flex w-fit gap-2 text-sm leading-snug font-medium text-gray-700 select-none dark:text-gray-400 mb-1.5 block">
      Email or phone <span class="text-red-500">*</span>
    </label>
    <input app-input unstyled
      id="signin-identifier"
      formControlName="email"
      type="text"
      autocomplete="username"
      placeholder="Enter your email or phone"
      class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white py-2.5 ps-4 pe-4 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-gray-500 dark:focus:border-brand-500/40"
      [class.border-red-500]="isFieldInvalid('email')"
      [class.ring-3]="isFieldInvalid('email')"
      [class.ring-red-500/20]="isFieldInvalid('email')"
      [attr.aria-invalid]="isFieldInvalid('email') ? 'true' : null"
    />
    @if (isFieldInvalid('email')) {
      <div role="alert" class="text-sm font-normal text-red-500 dark:text-red-400">
        {{ getFieldError('email') }}
      </div>
    }
  </div>

  <div
    role="group"
    data-slot="field"
    data-orientation="vertical"
    class="group/field flex w-full gap-2 flex-col *:w-full [&>.sr-only]:w-auto"
    [attr.data-invalid]="isFieldInvalid('password') ? 'true' : null"
  >
    <label for="signin-password" class="group/field-label peer/field-label flex w-fit gap-2 text-sm leading-snug font-medium text-gray-700 select-none dark:text-gray-400 mb-1.5 block">
      Password <span class="text-red-500">*</span>
    </label>
    <div
      class="group/input-group relative flex h-11 w-full min-w-0 items-center rounded-[10px] border border-gray-300 bg-white shadow-theme-xs outline-hidden transition-colors focus-within:border-brand-300 focus-within:ring-3 focus-within:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:focus-within:border-brand-500/40"
      [class.border-red-500]="isFieldInvalid('password')"
      [class.ring-3]="isFieldInvalid('password')"
      [class.ring-red-500/20]="isFieldInvalid('password')"
    >
      <input
        id="signin-password"
        formControlName="password"
        autocomplete="current-password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Enter your password"
        class="h-full flex-1 min-w-0 rounded-none border-0 bg-transparent py-2.5 ps-4 pe-2 text-sm font-normal text-gray-800 shadow-none outline-hidden placeholder:text-gray-400 focus:outline-hidden dark:text-white/90 dark:placeholder:text-gray-500"
        [attr.aria-invalid]="isFieldInvalid('password') ? 'true' : null"
      />
      <div class="order-last flex h-auto items-center justify-center pe-3.5 select-none">
        <button app-button variant="unstyled"
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          class="flex size-7 items-center justify-center rounded-md p-0 text-gray-500 transition-colors hover:bg-gray-50 hover:text-gray-800 dark:text-gray-400 dark:hover:bg-gray-700/50 dark:hover:text-white"
        >
          @if (showPassword) {
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
              class="size-5 fill-current"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M10 13.862a6.519 6.519 0 01-6.077-4.16 6.519 6.519 0 0112.154 0A6.519 6.519 0 0110 13.862zm0-9.819a8.019 8.019 0 00-7.585 5.416.75.75 0 000 .487 8.019 8.019 0 0015.17 0 .75.75 0 000-.487A8.019 8.019 0 0010 4.043zm-.008 3.801a1.858 1.858 0 100 3.716h.014a1.858 1.858 0 000-3.716h-.014z"
              />
            </svg>
          } @else {
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
              class="size-5 fill-current"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M4.638 3.577a.75.75 0 00-1.06 1.06l1.275 1.277a8.03 8.03 0 00-2.437 3.545.75.75 0 000 .487 8.019 8.019 0 0011.083 4.614l1.864 1.863a.75.75 0 101.06-1.06L4.638 3.576zm7.723 9.844l-1.914-1.913c-.14.034-.289.053-.44.053h-.015a1.858 1.858 0 01-1.803-2.312l-2.27-2.27a6.532 6.532 0 00-1.996 2.723 6.518 6.518 0 008.438 3.72zm3.716-3.719a6.516 6.516 0 01-1.257 2.03l1.061 1.06a8.012 8.012 0 001.704-2.846.75.75 0 000-.487A8.019 8.019 0 007.522 4.433l1.23 1.23a6.519 6.519 0 017.326 4.04z"
              />
            </svg>
          }
        </button>
      </div>
    </div>
    @if (isFieldInvalid('password')) {
      <div role="alert" class="text-sm font-normal text-red-500 dark:text-red-400">
        {{ getFieldError('password') }}
      </div>
    }
  </div>

  <div class="flex flex-wrap items-center justify-between gap-3 text-sm text-brand-500 dark:text-brand-400">
    <a routerLink="/verify-email">Verify email</a>
    <a routerLink="/forgot-password">Forgot password?</a>
  </div>
  <div>
    <button app-button variant="unstyled"
      type="submit"
      [disabled]="isSubmitting"
      class="inline-flex items-center justify-center gap-2 rounded-[10px] transition-all h-11 px-5 py-3 text-sm bg-brand-500 text-white shadow-theme-xs hover:bg-brand-600 disabled:bg-brand-200 dark:disabled:bg-brand-800 w-full disabled:cursor-not-allowed font-medium"
    >
      {{ (isSubmitting ? 'Signing In...' : 'Sign In') }}
    </button>
  </div>
</form>
