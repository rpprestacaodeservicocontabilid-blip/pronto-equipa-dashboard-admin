<div [class]="'flex w-full flex-1 flex-col lg:w-1/2 ' + className">
  <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-8">
    <div>
      <app-sign-in-header />

      <div>
        @if (showForm && googleEnabled) {
          <app-social-buttons [providers]="[{ id: 'google', name: 'Google' }]" (selectProvider)="googleSelect.emit()" />
          <app-auth-divider />
        }
        <ng-content />
        @if (showForm) {
          <app-sign-in-form-fields [isSubmitting]="isSubmitting" (formSubmit)="formSubmit.emit($event)" />
        }

        <div class="mt-5">
          <p class="text-center text-sm font-normal text-gray-700 sm:text-start dark:text-gray-400">
            Don't have an account?{{' '}}
            <a
              routerLink="/signup"
              class="text-brand-500 hover:text-brand-600 dark:text-brand-400"
            >
              Sign Up
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
