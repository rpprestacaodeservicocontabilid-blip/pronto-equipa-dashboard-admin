<div class="relative p-6 bg-white z-1 dark:bg-gray-900 sm:p-0">
  <label class="absolute top-4 end-4 z-20 sm:top-6 sm:end-6">
    <span class="sr-only" i18n="@@ui-16us7mj">Language</span>
    <select class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-800 shadow-theme-xs dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200"
      [value]="currentLocale" (change)="selectLocale($any($event.target).value)">
      @for (language of languages; track language.id) {
        <option [value]="language.id" [selected]="currentLocale === language.id" [lang]="language.id">{{ language.name }}</option>
      }
    </select>
  </label>
  <div
    class="relative flex min-h-dvh w-full flex-col justify-center lg:flex-row dark:bg-gray-900 sm:p-0"
  >
    <ng-content></ng-content>
    <div
      class="relative hidden w-full items-center bg-brand-950 dark:bg-white/5 lg:grid lg:w-1/2"
    >
      <div class="flex items-center justify-center z-1">
        <!-- ===== Common Grid Shape Start ===== -->
        <app-grid-shape />
        <div class="flex max-w-xs flex-col items-center gap-3">
          <a routerLink="/" class="flex items-center gap-3 text-title-sm font-semibold text-white">
            <img
              width="32"
              height="32"
              src="/images/logo/logo-icon.svg"
              alt=""
            />
            PRONTOEQUIPAS
          </a>
          <p class="text-center text-gray-400 dark:text-white/60">
            <ng-container i18n="@@platform-administration">Platform administration</ng-container>
          </p>
        </div>
      </div>
    </div>
    <div class="fixed z-50 hidden bottom-6 ltr:right-6 rtl:left-6 sm:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>
